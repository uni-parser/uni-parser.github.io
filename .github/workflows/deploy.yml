name: Deploy to GitHub Pages

on:
  push:
    branches: [rel/v1]

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm  # 先安装 pnpm
        uses: pnpm/action-setup@v4  # 使用最新 v4 版本
        with:
          version: latest  # 自动使用最新版本
      
      - name: Setup Node.js  # 再设置 Node，这时 pnpm 已可用
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'  # 现在可以安全地使用 pnpm 缓存
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm build

      - name: Config github pages
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
